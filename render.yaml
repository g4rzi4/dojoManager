# Despliegue en Render (Blueprint): base de datos, backend y frontend.
#
# En Render: New → Blueprint → elige este repositorio. Las variables con
# `sync: false` te las pide al crear; el resto se llena solo.
# Guía completa: docs/despliegue.md

databases:
  - name: dojomanager-db
    plan: free
    databaseName: dojomanager
    user: dojo
    postgresMajorVersion: "17"

services:
  # Backend (Express + Prisma)
  - type: web
    name: dojomanager-api
    runtime: node
    plan: free
    rootDir: backend
    # tsx y prisma generate necesitan las devDependencies para construir.
    buildCommand: npm ci --include=dev && npx prisma generate
    # Las migraciones van al arrancar: el plan gratis no tiene preDeployCommand.
    startCommand: npx prisma migrate deploy && npx tsx src/server.ts
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: dojomanager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # URL del frontend: CORS y enlaces de los correos (recuperar contraseña).
      - key: CORS_ORIGIN
        value: https://dojomanager-web.onrender.com
      - key: PUBLIC_APP_URL
        value: https://dojomanager-web.onrender.com
      # La clave que usa Zapier en el encabezado x-api-key.
      - key: AGENT_API_KEY
        sync: false
      # Vacía en producción: el agente le escribe a todas las familias.
      - key: AGENT_CORREOS_PERMITIDOS
        value: ""
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CURRENCY
        value: MXN
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  # Frontend (React + Vite), como sitio estático
  - type: web
    name: dojomanager-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://dojomanager-api.onrender.com
      - key: NODE_VERSION
        value: "22"
    # La app usa BrowserRouter: toda ruta debe servir index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
